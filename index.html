<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0d0f12;
      --surface:   #151820;
      --card:      #1c2030;
      --border:    #2a2f3d;
      --accent:    #4ade80;
      --accent2:   #38bdf8;
      --muted:     #4b5263;
      --text:      #e2e8f0;
      --text-soft: #8892a4;
      --red:       #f87171;
      --radius:    14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 16px rgba(74,222,128,0.4));
    }

    .header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-soft);
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
    }

    .card-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-soft);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tunnel selector */
    .tunnel-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tunnel-btn {
      flex: 1;
      min-width: 64px;
      padding: 12px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-soft);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .tunnel-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tunnel-btn.active {
      border-color: var(--accent);
      background: rgba(74,222,128,0.1);
      color: var(--accent);
    }

    .tunnel-btn .t-emoji { font-size: 18px; display: block; margin-bottom: 4px; }

    /* Row range input */
    .row-range-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row-num-btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
    }

    .row-num-btn:focus {
      outline: none;
      border-color: var(--accent2);
    }

    .row-separator {
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      font-size: 18px;
    }

    /* Event group */
    .event-group {
      margin-bottom: 12px;
    }

    .group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 0 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .event-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .event-option:hover {
      border-color: var(--accent2);
    }

    .event-option.active {
      border-color: var(--accent2);
      background: rgba(56,189,248,0.08);
    }

    .event-option .e-emoji { font-size: 20px; flex-shrink: 0; }
    .event-option .e-label { font-size: 14px; color: var(--text); font-weight: 500; }

    /* Value field */
    .value-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .value-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .value-input option {
      background: var(--card);
      color: var(--text);
    }

    /* Date */
    input[type="date"].value-input {
      color-scheme: dark;
    }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #0a0f0a;
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
      margin-top: 4px;
    }

    .submit-btn:hover { background: #86efac; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      background: var(--muted);
      color: var(--bg);
      cursor: not-allowed;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 14px 24px;
      border-radius: 50px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--accent); color: #0a0f0a; }
    .toast.error   { background: var(--red);   color: #fff; }

    /* Hidden */
    .hidden { display: none !important; }

    /* Step fade-in */
    .step {
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <span class="header-icon">🌸</span>
    <h1>Farm Tracker</h1>
    <p>Data entry — Project Speed Run</p>
  </div>

  <!-- STEP 1: Tunnel -->
  <div class="card step" id="step-tunnel">
    <div class="card-label">🏗️ Select Tunnel</div>
    <div class="tunnel-grid" id="tunnel-grid">
      <!-- generated by JS -->
    </div>
  </div>

  <!-- STEP 2: Rows -->
  <div class="card step hidden" id="step-rows">
    <div class="card-label">🌿 Row Range</div>
    <div class="row-range-wrap">
      <input type="number" class="row-num-btn" id="row-from" min="1" max="24" placeholder="1" inputmode="numeric" />
      <span class="row-separator">—</span>
      <input type="number" class="row-num-btn" id="row-to"   min="1" max="24" placeholder="24" inputmode="numeric" />
    </div>
  </div>

  <!-- STEP 3: Event -->
  <div class="card step hidden" id="step-event">
    <div class="card-label">📋 Event Type</div>

    <div class="event-group">
      <div class="group-label">📊 Measurements</div>
      <div class="event-options" id="group-measurements"></div>
    </div>

    <div class="event-group">
      <div class="group-label">🔍 Observations</div>
      <div class="event-options" id="group-observations"></div>
    </div>

    <div class="event-group">
      <div class="group-label">⚙️ Actions</div>
      <div class="event-options" id="group-actions"></div>
    </div>

    <div class="event-group">
      <div class="group-label">💊 Treatments</div>
      <div class="event-options" id="group-treatments"></div>
    </div>

  </div>

  <!-- STEP 4: Value -->
  <div class="card step hidden" id="step-value">
    <div class="card-label">✏️ Value</div>
    <div id="value-field-wrap"></div>
  </div>

  <!-- STEP 5: Date -->
  <div class="card step hidden" id="step-date">
    <div class="card-label">📅 Date</div>
    <input type="date" class="value-input" id="entry-date" />
  </div>

  <!-- Submit -->
  <button class="submit-btn hidden" id="submit-btn" onclick="submitEntry()">
    ✅ Submit Entry
  </button>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ─── CONFIG ─────────────────────────────────────────────────
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxXQlevCTtdY6ZQ6kN72bpWQOLZEWDjHmeRXclEOCl98E74NURIMTjRW9NkdG0a4eyWoQ/exec";

  const TUNNELS = [1, 2, 3, 4, 5, 6]; // extend as needed

  // ─── DATA ARCHIVE ───────────────────────────────────────────
  const DATA = {
    measurements: [
      { label: "Tunnel Temp Morning",    emoji: "🌡️", event: "Tunnel temperature morning",   valueType: "number" },
      { label: "Tunnel Temp Afternoon",  emoji: "🌡️", event: "Tunnel temperature afternoon", valueType: "number" },
      { label: "Tunnel Humidity Morning",emoji: "💧", event: "Tunnel humidity morning",       valueType: "number" },
      { label: "Tunnel Humidity Afternoon",emoji:"💧", event: "Tunnel humidity afternoon",    valueType: "number" },
      { label: "Soil Temp Morning",      emoji: "🌱", event: "Soil temperature morning",      valueType: "number" },
      { label: "Soil Temp Afternoon",    emoji: "🌱", event: "Soil temperature afternoon",    valueType: "number" },
      { label: "Soil Humidity Morning",  emoji: "🪣", event: "Soil humidity morning",         valueType: "number" },
      { label: "Soil Humidity Afternoon",emoji: "🪣", event: "Soil humidity afternoon",       valueType: "number" },
      { label: "Tunnel LUX Morning",     emoji: "☀️", event: "Tunnel LUX morning",            valueType: "number" },
      { label: "Tunnel LUX Afternoon",   emoji: "🌤️", event: "Tunnel LUX afternoon",          valueType: "number" },
      { label: "Plant BRIX",             emoji: "🍬", event: "Plant BRIX",                    valueType: "number" },
      { label: "Plant Height",           emoji: "📏", event: "Plant height",                  valueType: "number" },
      { label: "Plant Stage of Growth",  emoji: "🌿", event: "Plant stage of growth",         valueType: "number" },
    ],
    observations: [
      { label: "Observation Discovered", emoji: "🔴", event: "Observation discovered", valueType: "dropdown",
        options: ["Dry soil","Soaked soil","Weak roots","Rotting roots","Leaf sun burn","Leaf chemical burn",
                  "Leaf drooping","Leaf drying","Leaf spots","Aphids","Thrips","Red spidermite","Leaf miner",
                  "Botrytis","Caterpillar","Alternaria","Rhizoctonia","Powdery mildew","Rust spores","Nematode"] },
      { label: "Observation Resolved",   emoji: "✅", event: "Observation resolved",   valueType: "dropdown",
        options: ["Dry soil","Soaked soil","Weak roots","Rotting roots","Leaf sun burn","Leaf chemical burn",
                  "Leaf drooping","Leaf drying","Leaf spots","Aphids","Thrips","Red spidermite","Leaf miner",
                  "Botrytis","Caterpillar","Alternaria","Rhizoctonia","Powdery mildew","Rust spores","Nematode"] },
    ],
    actions: [
      { label: "Cut Down",     emoji: "✂️",  event: "Action", valueType: "fixed", fixedValue: "Cut down" },
      { label: "Prune / Trim", emoji: "🌿",  event: "Action", valueType: "fixed", fixedValue: "Prune/trim" },
      { label: "Tunnel Flush", emoji: "🚿",  event: "Action", valueType: "fixed", fixedValue: "Tunnel flush" },
      { label: "Weeding",      emoji: "🧹",  event: "Action", valueType: "fixed", fixedValue: "Weeding" },
      { label: "Watering",     emoji: "💦",  event: "Action", valueType: "fixed", fixedValue: "Watering" },
    ],
    treatments: [
      { label: "Treatment Spray",     emoji: "🧴", event: "Treatment spray",     valueType: "dropdown",
        options: ["Delfin WG","Leptibac BS","Eco BB","Methomex","Merpan 80 WDG","Saturate",

                  "RIM VEG 1","RIM VEG 2","RIM VEG 3","RIM CAL"] },
      { label: "Treatment Fertigate", emoji: "🌊", event: "Treatment fertigate", valueType: "dropdown",
        options: ["Delfin WG","Leptibac BS","Eco BB","Methomex","Merpan 80 WDG","Saturate",
                  "Odeon 720 SC","Serenade ASO","Naturafend 550 SP","Dythane M45","Euria",
                  "RIM VEG 1","RIM VEG 2","RIM VEG 3","RIM CAL"] },
      { label: "Treatment Drench",    emoji: "🪣", event: "Treatment drench",    valueType: "dropdown",
        options: ["Delfin WG","Leptibac BS","Eco BB","Methomex","Merpan 80 WDG","Saturate",
                  "Odeon 720 SC","Serenade ASO","Naturafend 550 SP","Dythane M45","Euria",
                  "RIM VEG 1","RIM VEG 2","RIM VEG 3","RIM CAL"] },
    ]
  };

  // ─── STATE ───────────────────────────────────────────────────
  let selectedTunnel = null;
  let selectedEvent  = null;

  // ─── INIT ────────────────────────────────────────────────────
  function init() {
    // Build tunnel buttons
    const grid = document.getElementById("tunnel-grid");
    TUNNELS.forEach(n => {
      const btn = document.createElement("button");
      btn.className = "tunnel-btn";
      btn.innerHTML = `<span class="t-emoji">🏗️</span>Tunnel ${n}`;
      btn.onclick = () => selectTunnel(n, btn);
      grid.appendChild(btn);
    });

    // Build event groups
    buildEventGroup("group-measurements", DATA.measurements);
    buildEventGroup("group-observations", DATA.observations);
    buildEventGroup("group-actions",      DATA.actions);
    buildEventGroup("group-treatments",   DATA.treatments);

    // Set today's date
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("entry-date").value = today;

    // Show rows step when both row inputs change
    ["row-from","row-to"].forEach(id => {
      document.getElementById(id).addEventListener("input", checkRowsReady);
    });
  }

  function buildEventGroup(containerId, items) {
    const container = document.getElementById(containerId);
    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "event-option";
      div.innerHTML = `<span class="e-emoji">${item.emoji}</span><span class="e-label">${item.label}</span>`;
      div.onclick = () => selectEvent(item, div);
      container.appendChild(div);
    });
  }

  // ─── INTERACTIONS ────────────────────────────────────────────
  function selectTunnel(n, btn) {
    selectedTunnel = n;
    document.querySelectorAll(".tunnel-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    show("step-rows");
  }

  function checkRowsReady() {
    const from = document.getElementById("row-from").value;
    const to   = document.getElementById("row-to").value;
    if (from && to) {
      show("step-event");
    }
  }

  function selectEvent(item, el) {
    selectedEvent = item;
    document.querySelectorAll(".event-option").forEach(e => e.classList.remove("active"));
    el.classList.add("active");
    buildValueField(item);
    show("step-value");
    show("step-date");
    show("submit-btn");
  }

  function buildValueField(item) {
    const wrap = document.getElementById("value-field-wrap");
    wrap.innerHTML = "";

    if (item.valueType === "number") {
      wrap.innerHTML = `<input type="number" class="value-input" id="entry-value" placeholder="Enter value" inputmode="decimal" step="0.1" />`;
    } else if (item.valueType === "dropdown") {
      const sel = document.createElement("select");
      sel.className = "value-input";
      sel.id = "entry-value";
      sel.innerHTML = `<option value="">Select...</option>`;
      item.options.forEach(opt => {
        sel.innerHTML += `<option value="${opt}">${opt}</option>`;
      });
      wrap.appendChild(sel);
    } else if (item.valueType === "fixed") {
      wrap.innerHTML = `<input type="text" class="value-input" id="entry-value" value="${item.fixedValue}" readonly style="opacity:0.6;" />`;
    }
  }

  function show(id) {
    const el = document.getElementById(id);
    el.classList.remove("hidden");
    el.style.animation = "none";
    el.offsetHeight; // reflow
    el.style.animation = "";
  }

  // ─── SUBMIT ──────────────────────────────────────────────────
async function submitEntry() {
    const from  = document.getElementById("row-from").value;
    const to    = document.getElementById("row-to").value;
    const value = document.getElementById("entry-value")?.value;
    const date  = document.getElementById("entry-date").value;

    if (!selectedTunnel || !from || !to || !selectedEvent || !value || !date) {
      showToast("⚠️ Please fill all fields", "error");
      return;
    }

    const rows      = from === to ? from : `${from}-${to}`;
    const event     = selectedEvent.event;
    const timestamp = date;

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting...";

    try {
      const res = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          timestamp: timestamp,
          tunnel: selectedTunnel,
          rows: rows,
          event: event,
          value: value
        })
      });

      const responseText = await res.text();
      console.log("Response status:", res.status);
      console.log("Response body:", responseText);

      if (!res.ok) throw new Error("HTTP " + res.status + ": " + responseText);

      showToast("✅ Entry submitted!", "success");
      resetForm();
    } catch (err) {
      console.error("Full error:", err);
      showToast("❌ Error: " + err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "✅ Submit Entry";
    }
  }

    const event     = selectedEvent.event;
    const timestamp = date;

    const btn = document.getElementById("submit-btn");

    try {
      const res = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          timestamp: timestamp,
          tunnel: selectedTunnel,
          rows: rows,
          event: event,
          value: value
        })
      });

      const responseText = await res.text();
      console.log("Response status:", res.status);
      console.log("Response body:", responseText);

      if (!res.ok) throw new Error("HTTP " + res.status + ": " + responseText);

      showToast("✅ Entry submitted!", "success");
      resetForm();
    } catch (err) {
      console.error("Full error:", err);
      showToast("❌ Error: " + err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "✅ Submit Entry";
    }
  }
no  const rows      = from === to ? from : `${from}-${to}`;
    const event     = selectedEvent.event;
    const timestamp = date;

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting...";

    try {
      const res = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          timestamp: timestamp,
          tunnel: selectedTunnel,
          rows: rows,
          event: event,
          value: value
        })
      });

      if (!res.ok) throw new Error("Request failed");

      showToast("✅ Entry submitted!", "success");
      resetForm();
    } catch (err) {
      showToast("❌ Failed — check connection", "error");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "✅ Submit Entry";
    }
  }

  function resetForm() {
    selectedTunnel = null;
    selectedEvent  = null;
    document.querySelectorAll(".tunnel-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".event-option").forEach(e => e.classList.remove("active"));
    document.getElementById("row-from").value = "";
    document.getElementById("row-to").value   = "";
    document.getElementById("value-field-wrap").innerHTML = "";
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("entry-date").value = today;
    ["step-rows","step-event","step-value","step-date","submit-btn"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
  }

  function showToast(msg, type) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  init();
</script>
</body>
</html>
